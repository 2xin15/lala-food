<!doctype html>
<html lang="zh-Hant-TW">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>跟拉拉熊一起吃</title>
<meta name="description" content="拉拉熊吃過說好吃的店、愛心清單，以及他在 Threads 上的原始評價。">
<link rel="icon" href="bear.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="style.css?v=7">

<header class="top" id="top">
  <div class="top-in">
    <a class="brand" href="#map" aria-label="跟拉拉熊一起吃，回到美食地圖">
      <img class="bear" src="bear.png" alt="">
      <span class="brand-text"><b>跟拉拉熊一起吃</b><small id="sub">他吃過說好吃的店，和愛心清單裡的口袋名單</small></span>
    </a>
    <nav class="nav" id="nav" aria-label="主要分頁">
      <a href="#map" data-tab="map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>
        <span>美食地圖</span>
      </a>
      <a href="#list" data-tab="list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>美食清單</span>
      </a>
      <a href="#me" data-tab="me">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
        <span>我的紀錄</span><i class="badge" id="me-badge" hidden></i>
      </a>
    </nav>
    <div class="auth" id="auth"></div>
  </div>
</header>

<main id="main">
  <!-- 美食地圖 -->
  <section class="view view-map" id="view-map" hidden aria-label="美食地圖">
    <div class="map-layout">
      <aside class="side" id="side">
        <div class="side-list" id="side-list">
          <div class="side-top">
            <div class="seg-slot"></div>
            <button class="pill pill-dice" data-random type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>隨機推薦</button>
          </div>
          <div class="filter-slot" id="slot-map"></div>
          <div class="side-count" id="side-count"></div>
          <ul class="rows compact" id="side-rows"></ul>
        </div>
        <div class="side-detail" id="side-detail" hidden></div>
      </aside>
      <div class="map-wrap">
        <div id="map" role="region" aria-label="美食地圖"></div>
        <div class="map-bar">
          <div class="seg-slot"></div>
          <button class="pill" data-open-filters type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="filter-label">篩選</span></button>
          <button class="pill pill-dice" data-random type="button" aria-label="隨機推薦"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg><span>隨機</span></button>
        </div>
        <div class="map-note" id="mapnote"></div>
        <div class="sheet" id="sheet" hidden></div>
      </div>
    </div>
  </section>

  <!-- 美食清單 -->
  <section class="view view-list" id="view-list" hidden aria-label="美食清單">
    <div class="wrap">
      <div class="list-top">
        <div class="seg-slot"></div>
        <a class="follow" id="follow" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/><path d="M12 7v6M9 10h6"/></svg>
          <span id="follow-text">整份清單存到我的 Google 地圖</span>
        </a>
      </div>
      <div class="filter-slot" id="slot-list"></div>
      <div class="result-head" id="result-head">
        <span class="total" id="total"></span>
        <button class="pill" data-open-filters type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="filter-label">篩選</span></button>
        <div class="toggle" role="group" aria-label="顯示方式">
          <button type="button" data-layout="cards" aria-pressed="true" aria-label="卡片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="8" height="16" rx="2"/><rect x="13" y="4" width="8" height="16" rx="2"/></svg><span>卡片</span></button>
          <button type="button" data-layout="rows" aria-pressed="false" aria-label="列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1" fill="currentColor"/><circle cx="3.5" cy="12" r="1" fill="currentColor"/><circle cx="3.5" cy="18" r="1" fill="currentColor"/></svg><span>列表</span></button>
        </div>
        <select id="sort" aria-label="排序">
          <option value="cat">依類型分組</option>
          <option value="new">最新加入在前</option>
        </select>
      </div>
      <div id="results"></div>
      <p class="foot">資料來自 Google 地圖清單與拉拉熊（@zeke_6973）的 Threads。點「地圖」可在 Google 地圖看營業時間與評論。</p>
    </div>
  </section>

  <!-- 我的紀錄 -->
  <section class="view view-me" id="view-me" hidden aria-label="我的紀錄">
    <div class="wrap" id="me"></div>
  </section>
</main>

<!-- 篩選區（依畫面大小移到地圖側欄、清單上方或手機的篩選面板） -->
<div class="filters" id="filters">
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="搜尋店名、區域、拉拉熊說過的話…" autocomplete="off">
  </label>
  <div class="group">
    <h2>地區<small>可複選</small></h2>
    <div class="chips" id="cities" role="group" aria-label="地區（可複選）"></div>
  </div>
  <div class="group">
    <h2>類型<small>可複選</small></h2>
    <div class="chips" id="chips" role="group" aria-label="類型（可複選）"></div>
  </div>
  <div class="group">
    <h2>其他</h2>
    <div class="chips" id="extras" role="group" aria-label="其他篩選"></div>
  </div>
</div>

<dialog class="panel-dlg" id="filter-dlg" aria-labelledby="filter-dlg-title">
  <div class="panel-in">
    <div class="panel-head">
      <h3 id="filter-dlg-title">篩選</h3>
      <button class="linkbtn" type="button" data-clear-filters>清除</button>
      <button class="pill pill-on" type="button" data-close>看 <span id="filter-dlg-n">0</span> 家</button>
    </div>
    <div class="panel-body" id="slot-sheet"></div>
  </div>
</dialog>

<dialog class="panel-dlg detail-dlg" id="detail-dlg" aria-label="店家資訊">
  <div class="panel-in" id="detail-dlg-body"></div>
</dialog>

<dialog class="reader" id="reader" aria-labelledby="reader-title">
  <div class="reader-in">
    <div class="reader-head">
      <h3 id="reader-title"></h3>
      <button class="x" id="reader-close" aria-label="關閉">×</button>
    </div>
    <div class="reader-nav" id="reader-nav"></div>
    <div class="reader-body" id="reader-body"></div>
    <div class="reader-foot">
      <span id="reader-date"></span>
      <a class="btn" id="reader-open" href="#" target="_blank" rel="noopener">在 Threads 打開</a>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="data.js?v=7"></script>
<script src="posts.js?v=7"></script>
<script src="taiwan.js"></script>
<script src="firebase-config.js?v=7"></script>
<script type="module" src="cloud.js?v=7"></script>
<script src="app.js?v=7"></script>
